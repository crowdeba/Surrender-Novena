<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1936">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surrender">
<title>Surrender</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230E1936'/%3E%3Cpath d='M12 3c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z' fill='%23F3B65B'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #EDF0F7;
  --surface: #FFFFFF;
  --ink: #14214A;
  --muted: #55638A;
  --line: #D3DAEA;
  --flame: #C27A12;
  --wax: #8C98BE;
  --wax-out: #CBD3E6;
  --btn: #1B2F78;
  --btn-ink: #FFFFFF;
  --focus: #1B2F78;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1936;
    --surface: #16244B;
    --ink: #ECEFF8;
    --muted: #9FAAC9;
    --line: #2A3A6C;
    --flame: #F3B65B;
    --wax: #AAB5D6;
    --wax-out: #2F3F73;
    --btn: #F3B65B;
    --btn-ink: #1A1405;
    --focus: #F3B65B;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 18px; line-height: 1.55;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 20px 56px; }
h1, h2, h3 { font-weight: 600; line-height: 1.15; margin: 0; }
p { margin: 0 0 12px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 18px; }
.brand { font-size: 1.15rem; font-weight: 600; letter-spacing: .01em; }
.nav { display: flex; gap: 4px; font-family: var(--sans); }
.nav button { background: none; border: 0; padding: 9px 12px; border-radius: 999px; font-size: .92rem; color: var(--muted); cursor: pointer; min-height: 44px; }
.nav button[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }

.hero { text-align: center; padding: 8px 0 6px; }
.day { font-size: clamp(3.4rem, 17vw, 5.2rem); letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 1rem; margin-top: 6px; }
.candles { display: flex; justify-content: center; gap: 7px; margin: 22px 0 6px; }
.candle { width: 24px; height: 52px; }
.candle .wax { fill: var(--wax-out); }
.candle .wick { fill: var(--wax); opacity: .7; }
.candle .flame { fill: var(--flame); opacity: 0; transform-origin: 12px 14px; }
.candle.lit .wax, .candle.now .wax { fill: var(--wax); }
.candle.lit .flame, .candle.now .flame { opacity: 1; }
.candle.now .flame { fill: none; stroke: var(--flame); stroke-width: 1.5; animation: flicker 3.4s ease-in-out infinite; }   /* today: an outline until you have prayed */
@keyframes flicker { 0%,100% { transform: scale(1) rotate(0deg); } 30% { transform: scale(.94,1.05) rotate(-2deg); } 62% { transform: scale(1.03,.97) rotate(1.5deg); } }

.note-line { text-align: center; color: var(--muted); margin: 14px 0 0; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; padding: 12px 18px; border-radius: 14px; border: 1.5px solid transparent; font-family: var(--sans); font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; }
.btn.primary { background: var(--btn); color: var(--btn-ink); }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { min-height: 44px; font-size: .92rem; width: auto; display: inline-flex; padding: 8px 16px; }
.btn.danger { background: transparent; color: #B3261E; border-color: #B3261E; }
@media (prefers-color-scheme: dark) { .btn.danger { color: #FF9B93; border-color: #FF9B93; } }
.stack { display: grid; gap: 12px; }
.hint { font-family: var(--sans); font-size: .85rem; color: var(--muted); margin: 8px 0 0; text-align: center; }

.section { margin-top: 30px; }
.section h2 { font-size: 1.2rem; margin-bottom: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }

.counter { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tap { position: relative; width: 168px; height: 168px; border-radius: 50%; border: 0; background: var(--surface); cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.tap svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.tap .track { fill: none; stroke: var(--line); stroke-width: 6; }
.tap .fill { fill: none; stroke: var(--flame); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .25s ease; }
.tap .count { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.tap .n { font-size: 2.6rem; font-weight: 600; }
.tap .of { font-family: var(--sans); font-size: .85rem; color: var(--muted); margin-top: 4px; }
.refrain { text-align: center; font-style: italic; max-width: 22em; margin: 0; }
.counter .reset { font-family: var(--sans); font-size: .85rem; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 12px; }

label { display: block; font-family: var(--sans); font-size: .92rem; color: var(--muted); margin-bottom: 6px; }
textarea, input[type="text"], input[type="number"], select {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 1rem; line-height: 1.5; font-family: var(--serif);
}
textarea { min-height: 120px; resize: vertical; }
.saved { font-family: var(--sans); font-size: .8rem; color: var(--muted); margin: 6px 0 0; min-height: 1.2em; }

details { border-top: 1px solid var(--line); padding: 10px 0; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; font-family: var(--sans); font-size: .95rem; min-height: 44px; display: flex; align-items: center; }
.copytext { white-space: pre-wrap; padding: 4px 0 8px; }
.read .copytext { font-size: 1.08rem; line-height: 1.75; padding: 2px 0; }
.hrow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-family: var(--sans); font-size: .95rem; }
.hrow:first-of-type { border-top: 0; }
.hrow .when { color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

.entry { margin-bottom: 14px; }
.entry h3 { font-size: 1.05rem; }
.entry .date { font-family: var(--sans); font-size: .82rem; color: var(--muted); margin: 2px 0 8px; }
.entry .text { white-space: pre-wrap; margin: 0 0 10px; }
.entry .row { display: flex; gap: 8px; flex-wrap: wrap; }
.entry.resolved .text { opacity: .8; }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.links a { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-decoration: none; font-family: var(--sans); font-size: .95rem; }
.fine { font-family: var(--sans); font-size: .85rem; color: var(--muted); }

#flash { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 92vw; background: var(--ink); color: var(--bg); font-family: var(--sans); font-size: .9rem; padding: 12px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 5; }
#flash.on { opacity: 1; }
.warn { font-family: var(--sans); font-size: .88rem; background: var(--surface); border: 1px solid var(--flame); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
@media (prefers-reduced-motion: reduce) { .candle.now .flame { animation: none; } .tap .fill { transition: none; } }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="flash" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var KEY = 'surrender-novena-v1';
  var SITE = 'https://www.surrendernovena.com/';
  var DEFAULT_REFRAIN = 'Jesus, I surrender myself to You. Take care of everything.';
  var LOCK_KEY = 'surrender-novena-lock-v1';
  var S, view = 'today', setupDay = 1, bulkText = '', bulkParts = null, locked = false, lockMsg = '', hiddenAt = 0, memoryOnly = false, noteTimer = null, flashTimer = null;

  /* ---------- helpers ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateStr(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dateStr(); }
  function gap(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function prettyDate(s) { try { return new Date(s + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return s; } }

  /* ---------- state ---------- */
  function fresh() {
    return { v: 1, cycle: 1, day: 1, done: [0, 0, 0, 0, 0, 0, 0, 0, 0], lastDoneDate: null, lastDoneDay: null, lastDoneCycle: null,
      justFinished: false, seenWelcome: false, daysPrayed: 0, cyclesCompleted: 0, history: [], journal: {}, counter: { date: '', n: 0 },
      settings: { refrain: DEFAULT_REFRAIN, target: 10, offline: {} } };
  }
  function normalize(s) {
    var f = fresh();
    if (!s || typeof s !== 'object') return f;
    f.cycle = Math.max(1, parseInt(s.cycle, 10) || 1);
    f.day = Math.min(9, Math.max(1, parseInt(s.day, 10) || 1));
    if (Array.isArray(s.done) && s.done.length === 9) f.done = s.done.map(function (x) { return x ? 1 : 0; });
    f.lastDoneDate = typeof s.lastDoneDate === 'string' ? s.lastDoneDate : null;
    f.lastDoneDay = parseInt(s.lastDoneDay, 10) || null;
    f.lastDoneCycle = parseInt(s.lastDoneCycle, 10) || null;
    f.justFinished = !!s.justFinished;
    f.seenWelcome = !!s.seenWelcome;
    if (Array.isArray(s.history)) f.history = s.history.filter(function (h) { return h && typeof h.date === 'string' && h.day >= 1 && h.day <= 9 && h.cycle >= 1; }).map(function (h) { return { date: h.date, cycle: parseInt(h.cycle, 10), day: parseInt(h.day, 10) }; }).slice(-2000);
    f.daysPrayed = Math.max(0, parseInt(s.daysPrayed, 10) || 0);
    f.cyclesCompleted = Math.max(0, parseInt(s.cyclesCompleted, 10) || 0);
    if (s.journal && typeof s.journal === 'object') f.journal = s.journal;
    if (s.counter && typeof s.counter === 'object') f.counter = { date: String(s.counter.date || ''), n: Math.max(0, parseInt(s.counter.n, 10) || 0) };
    if (s.settings && typeof s.settings === 'object') {
      if (typeof s.settings.refrain === 'string' && s.settings.refrain.trim()) f.settings.refrain = s.settings.refrain;
      f.settings.target = Math.min(99, Math.max(1, parseInt(s.settings.target, 10) || 10));
      if (s.settings.offline && typeof s.settings.offline === 'object') f.settings.offline = s.settings.offline;
    }
    return f;
  }
  function load() {
    try { var raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : fresh(); }
    catch (e) { memoryOnly = true; return fresh(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { if (!memoryOnly) { memoryOnly = true; render(); } }
  }
  function flash(msg) {
    var el = document.getElementById('flash'); el.textContent = msg; el.className = 'on';
    clearTimeout(flashTimer); flashTimer = setTimeout(function () { el.className = ''; }, 3200);
  }

  /* ---------- passcode lock (optional) ---------- */
  function canLock() { return !!(window.crypto && window.crypto.subtle && window.TextEncoder); }
  function sha(str) {
    return window.crypto.subtle.digest('SHA-256', new window.TextEncoder().encode(str)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function getLock() { try { var r = localStorage.getItem(LOCK_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function lockView() {
    return '<div class="top"><div class="brand">Surrender</div></div><section class="section" style="margin-top:36px;text-align:center"><h1 class="day" style="font-size:2.4rem">Locked</h1><p class="sub">Enter your passcode.</p>' +
      '<div class="stack" style="margin:18px auto 0;max-width:280px"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="Passcode" style="text-align:center;font-size:1.6rem;letter-spacing:.4em"><button class="btn primary" data-act="unlock">Unlock</button></div>' +
      '<p class="hint" id="pinmsg" role="alert">' + esc(lockMsg) + '</p><p class="hint"><button class="reset" data-act="forgot">Forgot it? Erase everything and start fresh</button></p></section>';
  }

  /* ---------- derived ---------- */
  function prayedToday() { return S.lastDoneDate === today(); }
  function shownDay() { return prayedToday() ? S.lastDoneDay : S.day; }
  function shownCycle() { return prayedToday() ? S.lastDoneCycle : S.cycle; }
  function noteKey() { return shownCycle() + ':' + shownDay(); }
  function count() { return S.counter.date === today() ? S.counter.n : 0; }
  function doneCount() { return S.done.reduce(function (a, b) { return a + b; }, 0); }

  /* ---------- actions ---------- */
  function markDone() {
    if (prayedToday()) return;
    var d = S.day, c = S.cycle;
    S.done[d - 1] = 1; S.lastDoneDate = today(); S.lastDoneDay = d; S.lastDoneCycle = c; S.daysPrayed++;
    S.history.push({ date: today(), cycle: c, day: d });
    if (d === 9) { S.cyclesCompleted++; S.justFinished = true; S.cycle = c + 1; S.day = 1; S.done = [0, 0, 0, 0, 0, 0, 0, 0, 0]; }
    else { S.day = d + 1; S.justFinished = false; }
    save(); render();
  }
  function prayAnother() { S.lastDoneDate = null; S.justFinished = false; save(); render(); }
  function tap() {
    var n = count(), t = S.settings.target;
    if (n >= t) return;
    n++; S.counter = { date: today(), n: n }; save();
    if (navigator.vibrate) { try { navigator.vibrate(n >= t ? [30, 60, 30] : 12); } catch (e) {} }
    render();
  }
  function resetCount() { S.counter = { date: today(), n: 0 }; save(); render(); }
  function setNote(text) {
    var k = noteKey(), e = S.journal[k];
    if ((e ? e.text : '') === text || (!e && !text.trim())) return;   // nothing changed, so don't touch storage
    if (!text.trim()) { if (e) delete S.journal[k]; }
    else S.journal[k] = { text: text, date: e ? e.date : today(), cycle: shownCycle(), day: shownDay(), resolved: e ? !!e.resolved : false };
    save();
    var el = document.getElementById('saved'); if (el) el.textContent = text.trim() ? 'Saved on this device.' : '';
  }

  /* ---------- views ---------- */
  function candleSvg(state) {
    return '<svg class="candle ' + state + '" viewBox="0 0 24 52" aria-hidden="true">' +
      '<path class="flame" d="M12 2c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/>' +
      '<rect class="wick" x="11.4" y="15" width="1.2" height="6"/>' +
      '<rect class="wax" x="6" y="21" width="12" height="29" rx="2"/></svg>';
  }
  function candleRow() {
    var h = '', lit = 0, i, st;
    var all = prayedToday() && S.justFinished;
    for (i = 0; i < 9; i++) {
      if (all || S.done[i]) { st = 'lit'; lit++; }
      else if (!prayedToday() && i === S.day - 1) st = 'now';
      else st = 'out';
      h += candleSvg(st);
    }
    return '<div class="candles" role="img" aria-label="' + lit + ' of 9 candles lit in this novena">' + h + '</div>';
  }
  function nav() {
    function b(v, l) { return '<button data-act="view" data-view="' + v + '"' + (view === v ? ' aria-current="page"' : '') + '>' + l + '</button>'; }
    return '<div class="top"><div class="brand">Surrender</div><nav class="nav" aria-label="Sections">' + b('today', 'Today') + b('journal', 'History') + b('settings', 'Settings') + '</nav></div>' +
      (memoryOnly ? '<div class="warn">Your browser is blocking saving, so nothing will be kept after you close this page. Try a normal (not private) window.</div>' : '');
  }
  function todayView() {
    var done = prayedToday(), d = shownDay(), c = shownCycle(), n = count(), t = S.settings.target, circ = 2 * Math.PI * 54;
    var gapDays = (!done && S.lastDoneDate) ? gap(S.lastDoneDate, today()) : 0;
    var e = S.journal[noteKey()], off = S.settings.offline[d];
    var line;
    if (done && S.justFinished) line = 'That&rsquo;s all nine days. Day 1 of the next novena begins tomorrow.';
    else if (done) line = 'Day ' + d + ' is prayed. Day ' + S.day + ' opens tomorrow.';
    else if (gapDays >= 2) line = 'Welcome back. Day ' + d + ' is waiting. There&rsquo;s nothing to catch up on.';
    else if (!S.lastDoneDate) line = 'Begin whenever you&rsquo;re ready.';
    else line = 'Take a breath. Today is Day ' + d + '.';

    var h = '';
    if (!S.seenWelcome && S.daysPrayed === 0) h += '<section class="card" style="margin-bottom:18px"><h2 style="font-size:1.15rem;margin-bottom:8px">Welcome</h2>' +
      '<p>This is a quiet companion for the Surrender Novena, nine days of prayer to Jesus. Each day, open that day&rsquo;s prayer, say your refrain, write down what you&rsquo;re handing over, and mark the day done. After Day 9 it starts again.</p>' +
      '<p>You can read each day&rsquo;s prayer inside the app by pasting it in once from the site. Everything you write or paste stays on this device. There are no accounts, and nothing is sent anywhere. This is an unofficial companion and isn&rsquo;t affiliated with surrendernovena.com.</p>' +
      '<button class="btn quiet small" data-act="welcome">Got it</button></section>';
    h += '<section class="hero"><h1 class="day">Day ' + d + '</h1><p class="sub">Novena ' + c + (done ? ', prayed today' : '') + '</p>' + candleRow() + '<p class="note-line">' + line + '</p></section>';

    if (off && String(off).trim()) {
      h += '<section class="section" style="margin-top:22px"><h2>The prayer for Day ' + d + '</h2><div class="card read"><div class="copytext">' + esc(off) + '</div></div>' +
        '<div class="actions"><button class="btn quiet small" data-act="opensetup" data-day="' + d + '">Edit my copy</button>' +
        '<a class="btn quiet small" href="' + SITE + 'novena-day-' + d + '" target="_blank" rel="noopener noreferrer">Open on the site</a></div></section>';
    } else {
      h += '<div class="stack" style="margin-top:18px"><a class="btn ' + (done ? 'quiet' : 'primary') + '" href="' + SITE + 'novena-day-' + d + '" target="_blank" rel="noopener noreferrer">Open Day ' + d + ' on surrendernovena.com</a>' +
        '<button class="btn quiet" data-act="opensetup" data-day="' + d + '">Read it here instead</button></div>' +
        '<p class="hint">Copy the prayer from the site once and paste it here. After that it opens inside the app.</p>';
    }

    h += '<section class="section"><h2>Say it ' + t + ' times</h2><div class="counter">' +
      '<button class="tap" data-act="tap" aria-label="Count a prayer. ' + n + ' of ' + t + ' so far">' +
      '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="54"/><circle class="fill" cx="60" cy="60" r="54" stroke-dasharray="' + circ.toFixed(2) + '" stroke-dashoffset="' + (circ * (1 - Math.min(1, n / t))).toFixed(2) + '"/></svg>' +
      '<span class="count"><span class="n">' + n + '</span><span class="of">' + (n >= t ? 'done' : 'of ' + t) + '</span></span></button>' +
      '<p class="refrain">&ldquo;' + esc(S.settings.refrain) + '&rdquo;</p>' +
      (n > 0 ? '<button class="reset" data-act="resetcount">Start the count over</button>' : '') + '</div></section>';

    h += '<section class="section"><h2>What am I handing over today?</h2><label for="note">Write it down, then let it go. Only you can see this.</label>' +
      '<textarea id="note" data-field="note" placeholder="The thing that is weighing on me&hellip;">' + esc(e ? e.text : '') + '</textarea><p class="saved" id="saved">' + (e && e.text ? 'Saved on this device.' : '') + '</p></section>';

    h += '<div class="stack" style="margin-top:26px">' +
      (done ? '<button class="btn quiet" data-act="another">Pray another day now</button>' : '<button class="btn primary" data-act="done">I prayed today</button>') + '</div>';
    h += '<p class="hint" style="margin-top:22px">' + (S.cyclesCompleted ? S.cyclesCompleted + (S.cyclesCompleted === 1 ? ' novena finished. ' : ' novenas finished. ') : '') + S.daysPrayed + (S.daysPrayed === 1 ? ' day prayed in total.' : ' days prayed in total.') + '</p>';
    return h;
  }
  function journalView() {
    var h = '', keys = Object.keys(S.journal), hist = S.history.slice(), byCycle = {}, cycles, last = hist.length ? hist[hist.length - 1].date : null;
    if (!hist.length && !keys.length && !S.daysPrayed) return '<div class="empty"><p>Nothing here yet.</p><p>The days you pray and what you hand over will gather here, so you can look back.</p></div>';
    h += '<section class="section" style="margin-top:6px"><h2>Days prayed</h2><p class="fine">' + S.daysPrayed + (S.daysPrayed === 1 ? ' day prayed in total. ' : ' days prayed in total. ') +
      (S.cyclesCompleted ? S.cyclesCompleted + (S.cyclesCompleted === 1 ? ' novena finished. ' : ' novenas finished. ') : '') + (last ? 'Last prayed ' + esc(prettyDate(last)) + '.' : '') + '</p>';
    hist.forEach(function (e) { (byCycle[e.cycle] = byCycle[e.cycle] || []).push(e); });
    cycles = Object.keys(byCycle).map(Number).sort(function (x, y) { return y - x; });
    if (!cycles.length) h += '<p class="fine">Your day-by-day record starts from the next day you mark as prayed.</p>';
    cycles.forEach(function (cy) {
      var rows = byCycle[cy].slice().sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : x.day - y.day; });
      var days = {}; rows.forEach(function (r) { days[r.day] = 1; });
      h += '<div class="card" style="margin-top:10px"><h3 style="font-size:1.05rem;margin-bottom:6px">Novena ' + cy + (Object.keys(days).length === 9 ? ' (complete)' : '') + '</h3>' +
        rows.map(function (r) { return '<div class="hrow"><span>Day ' + r.day + '</span><span class="when">' + esc(prettyDate(r.date)) + '</span></div>'; }).join('') + '</div>';
    });
    h += '</section><section class="section"><h2>What I handed over</h2>';
    if (!keys.length) h += '<p class="fine">Nothing written yet. What you write on the Today page will gather here.</p>';
    var items = keys.map(function (k) { return { k: k, e: S.journal[k] }; }).sort(function (a, b) {
      if (a.e.date !== b.e.date) return a.e.date < b.e.date ? 1 : -1;
      if (a.e.cycle !== b.e.cycle) return b.e.cycle - a.e.cycle;
      return b.e.day - a.e.day;
    });
    h += items.map(function (it) {
      var e = it.e;
      return '<article class="card entry' + (e.resolved ? ' resolved' : '') + '"><h3>Novena ' + e.cycle + ', Day ' + e.day + '</h3><p class="date">' + esc(prettyDate(e.date)) + (e.resolved ? ' &ndash; resolved' : '') + '</p>' +
        '<p class="text">' + esc(e.text) + '</p><div class="row"><button class="btn quiet small" data-act="resolve" data-k="' + esc(it.k) + '">' + (e.resolved ? 'Mark as open again' : 'Mark as resolved') + '</button>' +
        '<button class="btn quiet small" data-act="delentry" data-k="' + esc(it.k) + '">Delete</button></div></article>';
    }).join('');
    return h + '</section>';
  }
  function settingsView() {
    var i, h = '', opts = '', offl = '', links = '';
    for (i = 1; i <= 9; i++) {
      opts += '<option value="' + i + '"' + (S.day === i ? ' selected' : '') + '>Day ' + i + '</option>';
      links += '<a href="' + SITE + 'novena-day-' + i + '" target="_blank" rel="noopener noreferrer">Day ' + i + '</a>';
      offl += '<details><summary>Day ' + i + (S.settings.offline[i] && String(S.settings.offline[i]).trim() ? ' (saved)' : '') + '</summary><textarea data-offline="' + i + '" aria-label="Your saved copy of Day ' + i + '">' + esc(S.settings.offline[i] || '') + '</textarea></details>';
    }
    h += '<section class="section" style="margin-top:6px"><h2>Where you are</h2><div class="card"><label for="daysel">Your next day to pray</label><select id="daysel" data-field="day">' + opts + '</select>' +
      '<p class="fine" style="margin-top:10px">Changing this lights the earlier candles. You can also start the novena over at Day 1.</p><button class="btn quiet small" data-act="restart">Start over at Day 1</button></div></section>';
    h += '<section class="section"><h2>The prayers</h2><div class="links">' + links + '</div><p class="fine" style="margin-top:10px">These open each day on surrendernovena.com. <a style="color:inherit" href="' + SITE + 'full-novena" target="_blank" rel="noopener noreferrer">The full novena page</a> has them together.</p></section>';
    h += '<section class="section"><h2>The words you repeat</h2><div class="card"><label for="refrain">Your refrain (edit it to match your copy)</label><input type="text" id="refrain" data-field="refrain" value="' + esc(S.settings.refrain) + '">' +
      '<div style="height:12px"></div><label for="target">How many times each day</label><input type="number" id="target" data-field="target" min="1" max="99" value="' + S.settings.target + '"></div></section>';
    h += '<section class="section"><h2>My saved prayers</h2><p class="fine">Read each day inside the app by pasting it in once from the site. It stays on this device.</p><button class="btn primary small" data-act="openbulk" style="margin-bottom:10px">Paste all nine days at once</button> <button class="btn quiet small" data-act="opensetup" data-day="' + firstMissingDay() + '" style="margin-bottom:12px">' + (firstMissingDay() === 1 && !(S.settings.offline[1] && String(S.settings.offline[1]).trim()) ? 'Set up all nine days' : 'Continue setting up') + '</button><div class="card">' + offl + '</div></section>';
    h += '<section class="section"><h2>Back up</h2><p class="fine">Everything is saved only on this device. To move to a new phone, copy this backup, then paste it into the same page on the new phone and tap Restore.</p><div class="card">' +
      '<label for="export">Your backup</label><textarea id="export" readonly>' + esc(JSON.stringify(S)) + '</textarea><div style="height:10px"></div><button class="btn quiet small" data-act="copy">Copy backup</button>' +
      '<div style="height:16px"></div><label for="import">Restore from a backup</label><textarea id="import" placeholder="Paste a backup here"></textarea><div style="height:10px"></div><button class="btn quiet small" data-act="restore">Restore</button></div></section>';
    h += '<section class="section"><h2>On your phone</h2><p class="fine">On iPhone, open this page in Safari, tap Share, then Add to Home Screen. For a daily nudge, add a repeating reminder in the Reminders app.</p></section>';
    if (canLock()) {
      var hasLock = !!getLock();
      h += '<section class="section"><h2>Passcode lock</h2><p class="fine">Optional. Asks for a 4-digit passcode when you open the app, so someone who picks up your phone can&rsquo;t read your notes. It keeps casual eyes out. It isn&rsquo;t encryption, so if you forget it, the only way back in is to erase everything and restore a backup.</p>' +
        (hasLock ? '<button class="btn quiet small" data-act="removepin">Turn off passcode</button>'
          : '<div class="card"><label for="newpin">Choose a 4-digit passcode</label><input id="newpin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" style="max-width:9em"><div style="height:10px"></div><button class="btn quiet small" data-act="setpin">Turn on passcode</button></div>') + '</section>';
    }
    h += '<section class="section"><h2>Share</h2><p class="fine">Anyone who opens this link gets their own private copy. You can&rsquo;t see theirs, and they can&rsquo;t see yours.</p><button class="btn quiet small" data-act="share">Share this app</button></section>';
    h += '<section class="section"><h2>About</h2><p class="fine">Surrender is an unofficial companion for the Surrender Novena by Servant of God Don Dolindo Ruotolo. The prayers live on surrendernovena.com, which isn&rsquo;t affiliated with this app. Nothing you enter here ever leaves your device.</p></section>';
    h += '<section class="section"><button class="btn danger" data-act="wipe">Erase everything on this device</button></section>';
    return h;
  }
  function setupView() {
    var n = setupDay, saved = S.settings.offline[n] || '';
    return '<section class="section" style="margin-top:6px"><h2>Read the prayers in the app</h2><p class="fine">Day ' + n + ' of 9. Copy each day once from the site and paste it here. It stays on this device.</p><button class="btn quiet small" data-act="openbulk" style="margin-top:4px">Paste all nine at once instead</button>' +
      '<div class="stack" style="margin-top:12px"><a class="btn primary" href="' + SITE + 'novena-day-' + n + '" target="_blank" rel="noopener noreferrer">1. Open Day ' + n + ' on surrendernovena.com</a></div>' +
      '<p class="fine" style="margin-top:12px">2. On that page, select the prayer text and copy it.</p>' +
      '<label for="setupbox" style="margin-top:12px">3. Come back here and paste it</label><textarea id="setupbox" style="min-height:220px" placeholder="Paste Day ' + n + ' here">' + esc(saved) + '</textarea>' +
      '<div class="stack" style="margin-top:14px"><button class="btn primary" data-act="setupsave">' + (n === 9 ? 'Save and finish' : 'Save and go to Day ' + (n + 1)) + '</button>' +
      '<div class="actions" style="margin-top:0">' + (n > 1 ? '<button class="btn quiet small" data-act="setupback">Back</button>' : '') +
      '<button class="btn quiet small" data-act="setupskip">Skip this day</button><button class="btn quiet small" data-act="setupexit">Finish later</button></div></div></section>';
  }
  function commitSetup() {
    var box = document.getElementById('setupbox'); if (!box) return;
    var v = box.value;
    if (v.trim()) S.settings.offline[setupDay] = v; else delete S.settings.offline[setupDay];
    save();
  }
  function splitNine(text) {
    var re = /\(\s*\d+\s*times?\s*\)/gi, parts = [], last = 0, m, tail;
    while ((m = re.exec(text)) !== null) { parts.push(text.slice(last, m.index + m[0].length)); last = m.index + m[0].length; }
    tail = text.slice(last).trim();
    if (parts.length === 8 && tail) parts.push(tail);
    if (parts.length !== 9) return null;
    return parts.map(function (p) { return p.trim().replace(/^(?:day\s*[1-9]\s*[:.)\-]?\s*|[1-9]\s*[:.)\-]\s*)/i, '').replace(/[ \t]+$/gm, '').trim(); });
  }
  function bulkView() {
    var h = '<section class="section" style="margin-top:6px"><h2>Paste all nine days at once</h2><p class="fine">Copy the whole novena from the site and paste it below. Each day should end with its &ldquo;(10 times)&rdquo; line, and I&rsquo;ll split it into nine days. It stays on this device.</p>' +
      '<textarea id="bulkbox" data-field="bulk" style="min-height:220px" placeholder="Paste the whole novena here">' + esc(bulkText) + '</textarea>' +
      '<div class="stack" style="margin-top:12px"><button class="btn primary" data-act="bulkcheck">Split into nine days</button></div>';
    if (bulkParts) {
      h += '<h2 style="margin-top:24px;font-size:1.1rem">Check it looks right</h2><div class="card">' + bulkParts.map(function (t, i) {
        var s = t.replace(/\s+/g, ' ').slice(0, 64); return '<p style="margin:0 0 8px"><strong>Day ' + (i + 1) + '</strong> ' + esc(s) + (t.length > 64 ? '&hellip;' : '') + '</p>'; }).join('') + '</div>' +
        '<div class="stack" style="margin-top:12px"><button class="btn primary" data-act="bulksave">Save all nine days</button></div>';
    }
    return h + '<div class="actions"><button class="btn quiet small" data-act="setupexit">Cancel</button><button class="btn quiet small" data-act="opensetup" data-day="1">Do it one day at a time</button></div></section>';
  }
  function firstMissingDay() { for (var i = 1; i <= 9; i++) { if (!(S.settings.offline[i] && String(S.settings.offline[i]).trim())) return i; } return 1; }
  function render() {
    var app = document.getElementById('app');
    if (locked) { app.innerHTML = lockView(); var pin = document.getElementById('pin'); if (pin) pin.focus(); return; }
    app.innerHTML = nav() + (view === 'today' ? todayView() : view === 'journal' ? journalView() : view === 'setup' ? setupView() : view === 'bulk' ? bulkView() : settingsView());
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-act]') : null; if (!t) return;
    var a = t.getAttribute('data-act'), k = t.getAttribute('data-k');
    if (a === 'view') { view = t.getAttribute('data-view'); render(); window.scrollTo(0, 0); }
    else if (a === 'welcome') { S.seenWelcome = true; save(); render(); }
    else if (a === 'openbulk') { commitSetup(); view = 'bulk'; bulkParts = null; render(); window.scrollTo(0, 0); }
    else if (a === 'bulkcheck') {
      var bb = document.getElementById('bulkbox'); bulkText = bb ? bb.value : bulkText; bulkParts = splitNine(bulkText); render();
      if (!bulkParts) flash('I couldn\u2019t find nine days. Each one should end with \u201C(10 times)\u201D, or paste one day at a time.');
    }
    else if (a === 'bulksave') {
      if (bulkParts) { for (var bi = 0; bi < 9; bi++) S.settings.offline[bi + 1] = bulkParts[bi]; save(); bulkParts = null; bulkText = ''; view = 'today'; render(); window.scrollTo(0, 0); flash('All nine days saved.'); }
    }
    else if (a === 'setpin') {
      var np = document.getElementById('newpin'), code = np ? np.value : '';
      if (!/^\d{4}$/.test(code)) { flash('Use exactly four digits.'); }
      else { var salt = Array.prototype.map.call(window.crypto.getRandomValues(new Uint8Array(8)), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        sha(salt + code).then(function (hash) { try { localStorage.setItem(LOCK_KEY, JSON.stringify({ salt: salt, hash: hash })); } catch (e) {} render(); flash('Passcode is on.'); }); }
    }
    else if (a === 'removepin') { try { localStorage.removeItem(LOCK_KEY); } catch (e) {} render(); flash('Passcode is off.'); }
    else if (a === 'unlock') {
      var lk = getLock(), pv = (document.getElementById('pin') || {}).value || '';
      if (!lk) { locked = false; render(); }
      else sha(lk.salt + pv).then(function (hash) { if (hash === lk.hash) { locked = false; lockMsg = ''; render(); } else { lockMsg = 'That isn\u2019t the right passcode.'; render(); } });
    }
    else if (a === 'forgot') {
      if (window.confirm('Erase everything on this device and remove the passcode? Your notes can only come back from a backup.')) { try { localStorage.removeItem(KEY); localStorage.removeItem(LOCK_KEY); } catch (e) {} S = fresh(); locked = false; lockMsg = ''; view = 'today'; render(); }
    }
    else if (a === 'opensetup') { setupDay = Math.min(9, Math.max(1, parseInt(t.getAttribute('data-day'), 10) || 1)); view = 'setup'; render(); window.scrollTo(0, 0); }
    else if (a === 'setupsave') { commitSetup(); if (setupDay < 9) { setupDay++; render(); window.scrollTo(0, 0); } else { view = 'today'; render(); window.scrollTo(0, 0); flash('All set.'); } }
    else if (a === 'setupskip') { commitSetup(); if (setupDay < 9) { setupDay++; render(); window.scrollTo(0, 0); } else { view = 'today'; render(); window.scrollTo(0, 0); } }
    else if (a === 'setupback') { commitSetup(); if (setupDay > 1) { setupDay--; } render(); window.scrollTo(0, 0); }
    else if (a === 'setupexit') { commitSetup(); view = 'today'; render(); window.scrollTo(0, 0); }
    else if (a === 'share') {
      var url = String(location.href).split('#')[0];
      if (navigator.share) { navigator.share({ title: 'Surrender', text: 'A private companion for the Surrender Novena.', url: url }).catch(function () {}); }
      else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { flash('Link copied.'); }, function () { flash('Copy the address from your browser.'); });
      else flash('Copy the address from your browser.');
    }
    else if (a === 'tap') tap();
    else if (a === 'resetcount') resetCount();
    else if (a === 'done') markDone();
    else if (a === 'another') prayAnother();
    else if (a === 'resolve') { if (S.journal[k]) { S.journal[k].resolved = !S.journal[k].resolved; save(); render(); } }
    else if (a === 'delentry') { if (window.confirm('Delete this entry for good?')) { delete S.journal[k]; save(); render(); } }
    else if (a === 'restart') { if (window.confirm('Start the novena over at Day 1?')) { S.day = 1; S.done = [0, 0, 0, 0, 0, 0, 0, 0, 0]; S.lastDoneDate = null; S.justFinished = false; save(); render(); flash('Back at Day 1.'); } }
    else if (a === 'copy') {
      var box = document.getElementById('export'); box.focus(); box.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(function () { flash('Backup copied.'); }, function () { flash('Select the text and copy it.'); });
      else flash('Select the text and copy it.');
    }
    else if (a === 'restore') {
      var txt = document.getElementById('import').value.trim();
      try { var o = JSON.parse(txt); if (!o || o.v !== 1) throw new Error('bad'); S = normalize(o); save(); render(); flash('Restored.'); }
      catch (e) { flash('That doesn\u2019t look like a Surrender backup.'); }
    }
    else if (a === 'wipe') {
      if (window.confirm('Erase all your progress and notes on this device? This can\u2019t be undone.')) { try { localStorage.removeItem(KEY); localStorage.removeItem(LOCK_KEY); } catch (e) {} S = fresh(); view = 'today'; render(); flash('Cleared.'); }
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute('data-field') === 'note') { clearTimeout(noteTimer); var v = t.value; noteTimer = setTimeout(function () { setNote(v); }, 350); }
    else if (t.getAttribute && t.getAttribute('data-offline')) { S.settings.offline[t.getAttribute('data-offline')] = t.value; save(); }
    else if (t.getAttribute && t.getAttribute('data-field') === 'bulk') { bulkText = t.value; }
  });
  document.addEventListener('focusout', function (ev) {
    var t = ev.target; if (t.getAttribute && t.getAttribute('data-field') === 'note') { clearTimeout(noteTimer); setNote(t.value); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target, f = t.getAttribute && t.getAttribute('data-field'); if (!f) return;
    if (f === 'refrain') { S.settings.refrain = t.value.trim() || DEFAULT_REFRAIN; save(); flash('Saved.'); }
    else if (f === 'target') { S.settings.target = Math.min(99, Math.max(1, parseInt(t.value, 10) || 10)); save(); render(); flash('Saved.'); }
    else if (f === 'day') {
      var n = parseInt(t.value, 10); S.day = n; S.done = [0, 0, 0, 0, 0, 0, 0, 0, 0].map(function (x, i) { return i < n - 1 ? 1 : 0; });
      S.lastDoneDate = null; S.justFinished = false; save(); render(); flash('Your next day is Day ' + n + '.');
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target && ev.target.id === 'pin') { var b = document.querySelector('[data-act="unlock"]'); if (b) b.click(); } });
  document.addEventListener('visibilitychange', function () {   // lock again if you were away for a couple of minutes
    if (document.hidden) { hiddenAt = Date.now(); }
    else if (hiddenAt && Date.now() - hiddenAt > 120000 && canLock() && getLock()) { locked = true; lockMsg = ''; render(); }
  });
  window.addEventListener('pagehide', function () { var n = document.getElementById('note'); if (n) setNote(n.value); });
  window.addEventListener('storage', function (ev) {   // keep two open copies (Safari and Home Screen) in sync
    if (ev.key !== KEY || !ev.newValue) return;
    try { S = normalize(JSON.parse(ev.newValue)); render(); } catch (e) {}
  });

  /* ---------- start ---------- */
  S = load();
  if (canLock() && getLock()) locked = true;
  if (S.justFinished && S.lastDoneDate !== today()) { S.justFinished = false; save(); }
  render();
})();
</script>
</body>
</html>
